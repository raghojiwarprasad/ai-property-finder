# Optional: publish physical-ai-mvp/ to a Hugging Face Space.
# One-time setup: add a GitHub repository secret HF_TOKEN (a Hugging Face "write" token),
# then run this workflow from the Actions tab (or push to the branch below).
name: Sync Physical AI MVP to Hugging Face Space
on:
  workflow_dispatch:
  push:
    branches: [claude/fervent-euler-yd7zui, main]
    paths: ["physical-ai-mvp/**"]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.26"
      - name: Upload folder to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: Pashu/physical-ai-data-mvp
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is not set. Create a Hugging Face write token at https://huggingface.co/settings/tokens and add it under Settings → Secrets and variables → Actions → New repository secret (name: HF_TOKEN)."
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(os.environ["SPACE_ID"], repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(folder_path="physical-ai-mvp", repo_id=os.environ["SPACE_ID"], repo_type="space",
                            ignore_patterns=["storage/**", ".venv/**", ".pytest-storage/**", "__pycache__/**", "*.pyc"],
                            commit_message="Sync from GitHub")
          print("Uploaded. https://huggingface.co/spaces/" + os.environ["SPACE_ID"])
          PY
      - name: Wait for the Space to build and start
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: Pashu/physical-ai-data-mvp
        run: |
          python - <<'PY'
          import os, time
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          last = None
          for _ in range(120):  # up to 40 minutes
              rt = api.get_space_runtime(os.environ["SPACE_ID"])
              stage = str(rt.stage)
              if stage != last:
                  print(time.strftime("%H:%M:%S"), stage, flush=True)
                  last = stage
              if "RUNNING" in stage:
                  print("Space is live: https://huggingface.co/spaces/" + os.environ["SPACE_ID"])
                  break
              if "ERROR" in stage or "FAILED" in stage:
                  print("::error::Space build/runtime failed with stage", stage, "- open the Space's Logs tab for details")
                  raise SystemExit(1)
              time.sleep(20)
          else:
              print("::warning::Timed out waiting for the Space to start; check its Logs tab")
          PY
